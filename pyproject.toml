[project]
name = "compliance-iq"
version = "0.1.0"
description = "AI-Driven Multi-Agent Regulatory Compliance System"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.1.0",
    "langchain-openai",
    "langchain-text-splitters",
    "openai",
    "chromadb",
    "networkx",
    "matplotlib",
    "gradio",
    "pydantic>=2.0",
    "langfuse",
    "pdfplumber>=0.11.9",
    "pdfreader>=0.1.15",
    "python-dotenv>=1.1.1",
    "pypdf2>=3.0.1",
    "python-docx>=1.2.0",
    "litellm>=1.83.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/complianceiq"]
